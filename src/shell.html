<title>캠페인 실습 노트</title>
<meta name="description" content="롯데백화점 부산 4개점 캠페인 미션을 골라 실습 ①~⑪ 워크시트를 완성하는 조별 실습 앱">
<style>
@font-face{font-family:"Pretendard Variable";font-weight:45 920;font-style:normal;font-display:swap;src:url("__PRETENDARD_SRC__") format("woff2-variations"),url("__PRETENDARD_SRC__") format("woff2")}
:root{
  --paper:#EDEFF3; --sheet:#FFFFFF; --ink:#141C28; --muted:#586473; --line:#D2D8E0; --line-soft:#E5E9EF;
  --field:#F6F7F9; --focus:#2F5FD0; --ex:#9AA3AE;
  --pen:#C4302A; --pen-bg:#FDEEEC; --hl:#FFE680; --hl-ink:#3A2F00;
  --ok:#1F7A4B; --ok-bg:#E1F3E8; --warn:#9A6212; --warn-bg:#FBEFD9; --bad:#B42B24; --bad-bg:#FBE5E3; --info:#2F5FD0; --info-bg:#E5ECFB;
  --mA:#2F5FD0; --mB:#0C8577; --mC:#C06A12; --mD:#7446BE; --mE:#56657A;
  --shadow:0 1px 2px rgba(20,28,40,.06),0 8px 24px -12px rgba(20,28,40,.2);
  --font:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0F141B; --sheet:#171E28; --ink:#E6EAF0; --muted:#9AA5B3; --line:#2D3845; --line-soft:#232C37;
    --field:#1D2632; --focus:#8AAEF0; --ex:#6B7684;
    --pen:#FF8A80; --pen-bg:#3A1F1E; --hl:#65511A; --hl-ink:#FFF2C6;
    --ok:#6CD49B; --ok-bg:#15301F; --warn:#EAB661; --warn-bg:#35280F; --bad:#FF8C85; --bad-bg:#3A1C1A; --info:#8AAEF0; --info-bg:#1A2A45;
    --mA:#7EA2F2; --mB:#4FC7B6; --mC:#F0A452; --mD:#B391F0; --mE:#A3B0C0;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0F141B; --sheet:#171E28; --ink:#E6EAF0; --muted:#9AA5B3; --line:#2D3845; --line-soft:#232C37;
  --field:#1D2632; --focus:#8AAEF0; --ex:#6B7684;
  --pen:#FF8A80; --pen-bg:#3A1F1E; --hl:#65511A; --hl-ink:#FFF2C6;
  --ok:#6CD49B; --ok-bg:#15301F; --warn:#EAB661; --warn-bg:#35280F; --bad:#FF8C85; --bad-bg:#3A1C1A; --info:#8AAEF0; --info-bg:#1A2A45;
  --mA:#7EA2F2; --mB:#4FC7B6; --mC:#F0A452; --mD:#B391F0; --mE:#A3B0C0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{overflow-x:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.6;margin:0;font-feature-settings:"ss06";-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mission-A{--m:var(--mA)} .mission-B{--m:var(--mB)} .mission-C{--m:var(--mC)} .mission-D{--m:var(--mD)} .mission-E{--m:var(--mE)}

/* 상단 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--line);padding-inline:16px}
.top-in{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-weight:800;font-size:20px;margin:0;letter-spacing:-.02em}
.brand small{color:var(--muted);font-size:12.5px}
.mission-chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--m);color:var(--ink);background:transparent;border-radius:99px;padding:4px 12px 4px 4px;cursor:pointer;font-weight:700;font-size:14px}
.mission-chip b{width:26px;height:26px;border-radius:50%;background:var(--m);color:#fff;display:grid;place-items:center;font-size:13px}
.mission-chip span{font-weight:500;font-size:12px;color:var(--muted)}
.who{display:flex;gap:10px;flex-wrap:wrap}
.who label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.who input{width:110px;border:0;border-bottom:1.5px solid var(--line);background:transparent;padding:3px 2px;font-size:14.5px;color:var(--ink);font-weight:600}
.who input:focus{outline:none;border-bottom-color:var(--focus)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:700;line-height:1.3;text-decoration:none;text-align:left}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger.armed{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.btn-pen{border-color:var(--pen);background:transparent;color:var(--pen)}
.btn-pen[aria-pressed="true"]{background:var(--pen);color:#fff}
.linkish{border:0;background:none;padding:0;color:var(--info);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.instructor{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:4px 10px;border-radius:8px;background:var(--pen-bg)}
.instructor .tag{font-size:12px;font-weight:800;color:var(--pen);letter-spacing:.04em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:transparent;padding:5px 10px;cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}

.export{max-width:1320px;margin:0 auto;padding-block:0 12px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.export .box{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--field)}
.export .box h3{margin:0;font-size:14px;font-weight:800}
.export .box p{margin:0;font-size:13px;color:var(--muted)}
.export textarea,.export input{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--sheet);padding:8px;font-size:12px}
.export textarea{min-height:64px}
.export .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.export .row input{flex:1 1 120px;width:auto;font-size:14px}

/* 레이아웃 */
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;grid-template-columns:268px minmax(0,1fr);gap:24px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:12px;min-width:0}
.case{--m:var(--ink);display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:10px;background:var(--ink);color:var(--sheet);border-left:6px solid var(--m)}
.case-code{font-size:11.5px;letter-spacing:.04em;opacity:.75;font-weight:600}
.case strong{font-size:23px;font-weight:800;line-height:1.25;letter-spacing:-.02em}
.case span:last-child{font-size:12.5px;opacity:.85;line-height:1.45}
#overall{font-size:12.5px;color:var(--muted);font-weight:600}
#nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav-item{width:100%;display:grid;grid-template-columns:28px 1fr;grid-template-rows:auto 3px;column-gap:6px;row-gap:5px;align-items:center;border:0;background:transparent;text-align:left;padding:7px 8px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:14px;font-weight:500}
.nav-item.nav-util{grid-template-rows:auto}
.nav-item:hover{background:var(--sheet)}
.nav-item.cur{background:var(--sheet);color:var(--ink);font-weight:800;box-shadow:var(--shadow)}
.nav-no{font-size:16px;grid-row:1/3;align-self:start;color:var(--ink);font-weight:700;text-align:center}
.nav-st{grid-column:2;height:3px;border-radius:2px;background:var(--line-soft);overflow:hidden;display:block}
.nav-st span{display:block;height:100%;background:var(--muted)}
.nav-st.st-done span{background:var(--ok)}
.side-foot{font-size:12px;color:var(--muted);line-height:1.5;margin:0}

/* 시트 */
main{min-width:0;outline:none}
.sheet{background:var(--sheet);border-radius:12px;box-shadow:var(--shadow);padding:28px clamp(16px,3vw,40px) 32px}
.sheet-head{border-bottom:2.5px solid var(--ink);padding-bottom:16px;margin-bottom:24px;display:flex;flex-direction:column;gap:6px}
.ctx{margin:0 0 6px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);border-left:4px solid var(--m);padding:2px 0 2px 10px}
.ctx b{color:var(--ink)}
.sheet-eyebrow{margin:0;font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.sheet-head h2{font-weight:800;font-size:clamp(25px,3.2vw,34px);margin:0;line-height:1.2;letter-spacing:-.025em;text-wrap:balance}
.lead{margin:0;max-width:70ch;font-size:16px;font-weight:500}
.lead-sub{margin:0;max-width:70ch;font-size:14px;color:var(--muted)}
.byline{margin:6px 0 0;font-size:13px;color:var(--muted)}
.byline u{text-decoration:none;border-bottom:1px solid var(--muted);color:var(--ink);padding:0 6px;margin-right:14px;display:inline-block;min-width:8em;font-weight:700}
.sheet-sites{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:6px;padding:10px 12px;background:var(--info-bg);border-radius:8px;font-size:13px}
.sheet-sites>span{font-weight:800;color:var(--info);margin-right:4px}
.sheet-sites .linkish{font-size:12.5px;margin-left:auto}
.sheet-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ans-note{margin:4px 0 0;font-size:13px;font-weight:700;color:var(--pen)}
.blocks{display:flex;flex-direction:column;gap:24px}
.note{align-self:flex-start;font-size:14.5px;color:var(--hl-ink);margin:0;background:var(--hl);display:block;padding:8px 12px;border-radius:6px;font-weight:600}

/* 링크 칩 */
.site-chip,.src-link{display:inline-flex;align-items:center;gap:3px;text-decoration:none;font-weight:700}
.site-chip{border:1px solid var(--line);background:var(--sheet);color:var(--info);border-radius:99px;padding:2px 10px;font-size:12.5px;line-height:1.6}
.site-chip:hover{border-color:var(--info)}
.src-link{color:var(--info);font-size:inherit}
.src-link:hover,.site-name:hover{text-decoration:underline;text-underline-offset:3px}
.ext{font-size:.85em;opacity:.8}

/* 입력 */
.field{display:flex;flex-direction:column;gap:6px}
.field-short{max-width:440px}
.field label{font-weight:800;font-size:14.5px}
.hint{font-size:12.5px;color:var(--muted);margin-top:-4px}
.q label{display:flex;gap:10px;align-items:flex-start;font-size:15.5px}
.qmark{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--sheet);display:grid;place-items:center;font-size:12px;font-weight:800}
textarea,input,select{width:100%;border:1px solid var(--line);background:var(--field);border-radius:6px;padding:8px 10px;font-size:14.5px;line-height:1.55;resize:vertical}
textarea{min-height:44px;overflow:hidden}
select{padding:7px 8px;cursor:pointer}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--focus);background:var(--sheet);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
input.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.inwrap{position:relative;display:block}
.inwrap.pct input{padding-right:24px}
.inwrap.pct::after{content:"%";position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}

.ex{color:var(--ex);font-size:12.5px;line-height:1.5;padding:4px 2px 0}
.ex span{font-weight:700}
.sheet-table td .ex{padding:4px 6px 0}

.nudge{font-size:12.5px;padding:4px 2px 0}
.sheet-table td .nudge{padding:4px 6px 0}
.nudge summary{cursor:pointer;color:var(--info);font-weight:700;width:max-content;list-style:none;display:inline-flex;align-items:center;gap:4px}
.nudge summary::-webkit-details-marker{display:none}
.nudge summary::before{content:"?";width:16px;height:16px;border-radius:50%;border:1.5px solid currentColor;display:inline-grid;place-items:center;font-size:10.5px}
.nudge[open] summary{color:var(--muted)}
.nudge p{margin:4px 0 0;padding:6px 10px;border-radius:6px;background:var(--info-bg);color:var(--ink);line-height:1.5}

/* 예시 답안 — 강사용 */
.ans{display:none;color:var(--pen);font-size:13.5px;line-height:1.55;padding:6px 8px 6px 10px;border-left:3px solid var(--pen);background:var(--pen-bg);border-radius:0 6px 6px 0;font-weight:500}
.show-ans .ans{display:block}

/* 표 */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.sheet-table table{border-collapse:collapse;width:100%;min-width:640px}
.sheet-table th,.sheet-table td{border:1px solid var(--line);padding:8px;vertical-align:top;text-align:left}
.sheet-table thead th{background:var(--ink);color:var(--sheet);font-size:13px;font-weight:700;padding:9px 10px}
.sheet-table tbody th{background:var(--field);font-size:14px;font-weight:800;width:190px;min-width:130px}
.row-sub{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:3px}
.row-sites{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.row-sites .site-chip{font-size:11.5px;padding:1px 8px}
.sheet-table td textarea,.sheet-table td input,.sheet-table td select{background:transparent;border-color:transparent;padding:4px 6px}
.sheet-table td textarea:focus,.sheet-table td input:focus,.sheet-table td select:focus{border-color:var(--focus);background:var(--sheet)}
.sheet-table td select{border-color:var(--line)}
.sheet-table td.col-area{min-width:200px}
.sheet-table td.col-text{min-width:150px}
.sheet-table td.col-num,.sheet-table td.col-pct,.sheet-table td.col-pick{width:110px;min-width:96px}

/* 케이스 시트 */
.caseinfo{display:flex;flex-direction:column;gap:14px}
.case-value{border:2px solid var(--m);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.cv-label{font-size:12px;font-weight:800;color:var(--m);letter-spacing:.06em}
.case-value strong{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.case-value p{margin:0;max-width:72ch}
.cv-dir{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px!important}
.cv-dir span{font-size:12.5px;font-weight:700;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:3px 9px}
table.facts{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
table.facts th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:2px solid var(--ink)}
table.facts td{padding:8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.facts td:first-child{color:var(--muted);white-space:nowrap;font-size:13px}
table.facts td:last-child{font-size:12.5px;min-width:150px}
.case-links{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0;font-size:13px;color:var(--muted);font-weight:600}

/* 미션 선택 */
.missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.mission{border:1px solid var(--line);border-top:6px solid var(--m);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--sheet)}
.mission.cur{box-shadow:0 0 0 2px var(--m)}
.mission header{display:flex;gap:10px;align-items:center}
.m-letter{width:40px;height:40px;border-radius:10px;background:var(--m);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;flex:none}
.mission h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.m-area{font-size:12.5px;color:var(--muted);font-weight:600}
.m-value{margin:0;font-size:19px;font-weight:800;color:var(--m);letter-spacing:-.01em}
.mission dl{margin:0;display:flex;flex-direction:column;gap:6px;flex:1}
.mission dt{font-size:11.5px;color:var(--muted);font-weight:700}
.mission dd{margin:0;font-size:13.5px;line-height:1.45}
.mission .btn{width:100%}
.howto{margin-top:28px;display:flex;flex-direction:column;gap:10px}
.howto h3{margin:0;font-size:18px;font-weight:800}
.howto ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;max-width:80ch}

/* 자료 찾기 */
.route{list-style:none;margin:0 0 24px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.route li{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;font-weight:800;font-size:14px;position:relative}
.route li span{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--sheet);display:grid;place-items:center;font-size:12px;margin-bottom:4px}
.route small{font-weight:500;color:var(--muted);font-size:12.5px}
.site-cat{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.site-cat h3{margin:0;font-size:17px;font-weight:800;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.site-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.site{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.site h4{margin:0;font-size:16px}
.site-name{color:var(--info);text-decoration:none;font-weight:800;display:inline-flex;gap:4px;align-items:baseline}
.site-what{margin:0;font-size:13.5px;font-weight:600}
.site-how{margin:0;padding-left:18px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px;flex:1}
.site-url{margin:0;font-size:11.5px;color:var(--muted);word-break:break-all}
.kwbox{display:flex;flex-direction:column;gap:4px}
.kwbox label{font-size:12px;font-weight:700;color:var(--muted)}
.kwrow{display:flex;gap:6px}
.kwrow input{flex:1;min-width:0;padding:6px 8px}
.sources{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.sources li{display:flex;gap:10px;align-items:baseline}
.src-no{flex:none;width:22px;font-weight:800;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

/* 자동 점검 */
.calc{border:1px dashed var(--line);border-radius:10px;padding:14px 16px;background:var(--field);display:flex;flex-direction:column;gap:10px}
.calc h4{margin:0;font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:800}
.calc-body{display:flex;flex-direction:column;gap:12px}
.calc-sub{margin:0;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.muted{color:var(--muted);margin:0;font-size:13px}
.chks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.chk .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--line)}
.chk-ok .dot{background:var(--ok)} .chk-warn .dot{background:var(--warn)} .chk-bad .dot{background:var(--bad)} .chk-info .dot{background:var(--info)}
.chk-bad{color:var(--bad)}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;font-weight:700;line-height:1.6}
.chip-ok{background:var(--ok-bg);color:var(--ok)} .chip-info{background:var(--info-bg);color:var(--info)} .chip-bad{background:var(--bad-bg);color:var(--bad)} .chip-warn{background:var(--warn-bg);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat{background:var(--sheet);border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3;letter-spacing:-.01em}
.stat b small{font-size:13px;color:var(--muted);font-weight:600}
.stat span{font-size:12px;color:var(--muted);line-height:1.4}
.bars{display:flex;flex-direction:column;gap:6px}
.bar-row{display:grid;grid-template-columns:minmax(90px,180px) 1fr 64px;gap:10px;align-items:center;font-size:13px}
.bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:10px;background:var(--line-soft);border-radius:3px;overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .25s}
.bar-fill.off{background:var(--muted);opacity:.5}
.bar-val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
table.mini{border-collapse:collapse;width:100%;font-size:13px;min-width:380px}
table.mini th,table.mini td{padding:5px 8px;border-bottom:1px solid var(--line-soft);text-align:left}
table.mini th{font-size:12px;color:var(--muted);font-weight:600}
table.mini .n{text-align:right;font-variant-numeric:tabular-nums}
table.mini tr.sum td{font-weight:800;border-top:1.5px solid var(--ink);border-bottom:0}
table.mini .up{color:var(--ok)} table.mini .down{color:var(--bad)}
table.heat{border-collapse:collapse;font-size:12.5px;min-width:420px}
table.heat th,table.heat td{padding:4px 10px;text-align:center}
table.heat tbody th{text-align:left;font-weight:600}
table.heat td{color:var(--line)} table.heat td.on{color:var(--ink)}
svg.emo{width:100%;max-width:560px;height:auto;display:block;min-width:360px}
svg.emo .grid{stroke:var(--line);stroke-dasharray:3 4}
svg.emo .axis{fill:var(--muted);font-size:12px;font-family:var(--font)}
svg.emo .curve{stroke:var(--ink);stroke-width:2.5}
svg.emo .pt{fill:var(--sheet);stroke:var(--ink);stroke-width:2.5}
svg.emo .pt.low{fill:var(--pen);stroke:var(--pen)}
.readaloud{font-size:16px;line-height:1.85;max-width:72ch;margin:0}
.ra-0{box-shadow:inset 0 -2px var(--bad)} .ra-1{box-shadow:inset 0 -2px var(--info)} .ra-2{box-shadow:inset 0 -2px var(--ok)} .ra-3{box-shadow:inset 0 -2px var(--warn)}
.ra-empty{color:var(--muted);font-size:13px}
.poster{border:2.5px solid var(--ink);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:4px;background:var(--sheet)}
.poster-eyebrow{font-size:12px;color:var(--muted);font-weight:700}
.poster strong{font-size:32px;font-weight:800;line-height:1.2;letter-spacing:-.03em}
.poster em{font-style:normal;font-size:17px;font-weight:600}
.draft{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:var(--info-bg)}
.draft p{margin:0;font-size:14px;flex:1 1 280px}
.onepage{background:var(--sheet);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.op-head{background:var(--ink);color:var(--sheet);padding:18px 20px;display:flex;flex-direction:column;gap:2px}
.op-eyebrow{font-size:12px;opacity:.75;font-weight:600}
.op-head h3{font-size:30px;font-weight:800;margin:0;line-height:1.2;letter-spacing:-.03em}
.op-head p{margin:0;opacity:.9;font-weight:600}
.onepage dl{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.onepage dl div{padding:12px 16px;border-top:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}
.onepage dt{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:3px}
.onepage dd{margin:0;font-size:13.5px;line-height:1.55}

.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:32px;padding-top:18px;border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translate(-50%,20px);background:var(--ink);color:var(--sheet);padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* 조 선택 · 라운드 · 제출 */
.who select{width:auto;border:0;border-bottom:1.5px solid var(--line);background:transparent;padding:3px 2px;font-size:14.5px;font-weight:700;border-radius:0}
.sync{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.sync-ok{background:var(--ok-bg);color:var(--ok)} .sync-saving{background:var(--info-bg);color:var(--info)} .sync-err,.sync-ro{background:var(--warn-bg);color:var(--warn)}
.teampick{border:2px dashed var(--line);border-radius:12px;padding:16px;margin-bottom:22px;display:flex;flex-direction:column;gap:8px}
.teampick.set{border-style:solid;border-color:var(--ok)}
.teampick h3,.step-h{margin:0;font-size:18px;font-weight:800}
.step-h{margin-bottom:12px}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.team-btn{border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:10px 0;font-size:16px;font-weight:800;cursor:pointer}
.team-btn:hover{border-color:var(--ink)}
.team-btn.cur{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.roundbar{margin:6px 0 0;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:9px 12px;border-radius:8px;background:var(--field);border:1px solid var(--line);font-size:14px}
.roundbar.live{background:var(--hl);color:var(--hl-ink);border-color:transparent}
.js-timer{font-variant-numeric:tabular-nums;font-size:1.1em}
.js-timer.late{color:var(--bad)}
.locked-panel{border:2px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.locked-panel strong{font-size:20px;color:var(--ink)}
.locked-panel p{margin:0}
.nav-item.locked{opacity:.55}
.nav-title small{font-size:11px;font-weight:700;color:var(--muted);margin-left:4px}
.nav-title small.ok,.ok{color:var(--ok)}
.submit{margin-top:28px;padding:16px;border-radius:10px;background:var(--ok-bg);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.submit p{margin:0;flex:1 1 280px;font-size:14px}

/* 강사방 */
.room-conn{margin:4px 0 0;font-size:13px;font-weight:700}
.room-conn.on{color:var(--ok)} .room-conn.off{color:var(--warn)}
.room-controls{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.rc-status{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;font-size:15px}
.round-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.rchip{border:1.5px solid var(--line);background:var(--sheet);border-radius:8px;padding:6px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;font-size:12.5px;font-weight:600;line-height:1.3;color:var(--ink)}
.rchip span{font-size:15px;font-weight:800}
.rchip small{color:var(--muted);font-weight:500}
.rchip.future{opacity:.55}
.rchip.live{border-color:var(--ok);background:var(--ok-bg)}
.rchip.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.rc-actions{display:flex;flex-wrap:wrap;gap:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
table.matrix{border-collapse:collapse;width:100%;min-width:760px;font-size:13.5px}
table.matrix th,table.matrix td{border-bottom:1px solid var(--line-soft);padding:5px 4px;text-align:center}
table.matrix thead th{font-size:12.5px;color:var(--muted);font-weight:800}
table.matrix tbody th{text-align:left;font-weight:800;white-space:nowrap;padding-right:10px}
table.matrix tbody th small{font-size:11px;color:var(--muted)}
table.matrix td:nth-child(2){text-align:left;white-space:nowrap}
table.matrix .live{background:var(--hl)}
table.matrix .when{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mcell{width:100%;min-width:40px;border:0;border-radius:6px;padding:6px 0;font-weight:800;font-size:12.5px;cursor:pointer;font-variant-numeric:tabular-nums;display:inline-block}
.mcell.done{background:var(--ok);color:#fff}
.mcell.doing{background:var(--info-bg);color:var(--info)}
.mcell.empty{background:var(--field);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--muted);margin:8px 0 0}
.legend .mcell{width:auto;min-width:0;padding:1px 8px;cursor:default}
.mbadge{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--m);color:#fff;font-weight:800;font-size:12px}
.empty-room{border:2px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.empty-room p{margin:4px 0 0}
.room-view{margin-top:26px;display:flex;flex-direction:column;gap:14px}
.rv-head{display:flex;flex-direction:column;gap:10px}
.rv-head h3{margin:0;font-size:20px;font-weight:800}
.rv-head h3 small{font-size:13px;color:var(--muted);font-weight:600}
.team-tabs{display:flex;flex-wrap:wrap;gap:6px}
.team-tabs button{border:1px solid var(--line);background:var(--sheet);border-radius:99px;padding:3px 12px;font-weight:700;cursor:pointer;font-size:13px}
.team-tabs button.cur{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.cards{display:flex;flex-direction:column;gap:14px}
.rcard{border:1px solid var(--line);border-left:5px solid var(--m);border-radius:10px;overflow:hidden;background:var(--sheet)}
.rcard>header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--field);border-bottom:1px solid var(--line-soft);font-size:14px}
.rcard>header>b{font-size:16px}
.rstate{margin-left:auto;font-size:12px;font-weight:800;padding:2px 10px;border-radius:99px}
.rstate.done{background:var(--ok);color:#fff} .rstate.doing{background:var(--info-bg);color:var(--info)} .rstate.empty{background:var(--line-soft);color:var(--muted)}
.rbody{padding:14px;display:flex;flex-direction:column;gap:14px}
.rbody .field label{font-size:13.5px}
.rbody .sheet-table table{min-width:560px}
.rbody .row-sites,.rbody .row-sub,.rbody .hint{display:none}
.ro{font-size:13.5px;line-height:1.55;padding:2px 4px;white-space:normal}
.ro-empty{color:var(--line)}
.reset-box{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:6px;padding:12px 14px;border:1.5px solid var(--bad);border-radius:10px;background:var(--bad-bg)}
.reset-box>div{flex:1 1 320px}
.reset-box p{margin:2px 0 0}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger-solid.armed{background:#7f1d1a;border-color:#7f1d1a}
.matrix-tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:10px}
.import{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:28px}
.import summary{cursor:pointer;font-weight:800}
.import textarea{margin-top:8px;font-size:12px;min-height:64px}
.import .row{margin-top:8px}
.import-list{margin:10px 0 0;padding-left:18px;font-size:13.5px}

@media (max-width:900px){
  .top{position:static}
  .wrap{grid-template-columns:minmax(0,1fr);gap:14px;padding-block:12px 48px}
  .side{position:static}
  #nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  #nav li{flex:none}
  .nav-item{width:auto;max-width:200px;background:var(--sheet);border:1px solid var(--line)}
  .nav-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-foot{display:none}
  .who input{width:92px}
}
@media (max-width:520px){
  .brand small{display:none}
  .sheet{padding:20px 14px 24px;border-radius:10px}
  .bar-row{grid-template-columns:96px 1fr 54px}
  .sheet-sites .linkish{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><h1>캠페인 실습 노트</h1><small>3-2 캠페인 기획 실습 · 조별 미션</small></div>
    <button type="button" id="missionChip" class="mission-chip" hidden></button>
    <div class="who">
      <label for="team">우리 조<select id="team"></select></label>
      <label for="author">작성자<input id="author" autocomplete="off" placeholder="이름"></label>
    </div>
    <div id="instructorBar" class="instructor" hidden>
      <span class="tag">강사</span>
      <div class="seg" role="group" aria-label="보기 선택">
        <button type="button" data-course="campaign" aria-pressed="true">3-2 조별 미션</button>
        <button type="button" data-course="promo" aria-pressed="false">3-1 케이스 C 참고</button>
      </div>
      <button type="button" class="btn btn-pen" data-act="answers" aria-pressed="true"><span>예시 답안 숨기기</span></button>
    </div>
    <span id="syncState" class="sync" role="status" hidden></span>
    <button type="button" id="instrLogin" class="btn ghost" data-act="instrLogin">강사</button>
    <button type="button" class="btn ghost" data-act="export" aria-expanded="false" aria-controls="exportPanel">내보내기 · 백업</button>
  </div>
  <div id="exportPanel" class="export" hidden>
    <div class="box">
      <h3>제출용 복사</h3>
      <p>①~⑪ 전체를 표 형식 텍스트로 복사하거나, 3-2 원본 시트 모양의 PPT로 내려받습니다.</p>
      <div class="row"><button type="button" class="btn" data-act="copyText">전체 내용 복사</button><button type="button" class="btn ghost" data-act="pptOwn">원본 시트 PPT 내려받기</button></div>
      <textarea id="copyOut" hidden readonly aria-label="복사할 내용"></textarea>
    </div>
    <div class="box">
      <h3>다른 기기로 옮기기</h3>
      <p>작성한 내용은 이 브라우저에만 저장됩니다. 백업 코드를 복사해 다른 기기에 붙여 넣으십시오.</p>
      <div class="row"><button type="button" class="btn ghost" data-act="copyCode">백업 코드 복사</button></div>
      <textarea id="restoreIn" placeholder="여기에 백업 코드를 붙여 넣고 불러오기" aria-label="백업 코드 붙여 넣기"></textarea>
      <div class="row"><button type="button" class="btn ghost" data-act="restore">불러오기</button></div>
    </div>
    <div class="box">
      <h3>강사 모드</h3>
      <p id="instrState"></p>
      <div class="row"><input id="instrCode" type="password" placeholder="강사 비밀번호" aria-label="강사 비밀번호" inputmode="numeric" autocomplete="off"><button type="button" id="instrOn" class="btn ghost" data-act="instrOn">강사 모드 켜기</button><button type="button" id="instrOff" class="btn ghost" data-act="instrOff" hidden>강사 모드 끄기</button></div>
    </div>
  </div>
</header>

<div class="wrap">
  <aside class="side" aria-label="워크시트 목록">
    <div class="case" id="case"></div>
    <span id="overall"></span>
    <ol id="nav"></ol>
    <p class="side-foot">막대는 칸을 채운 정도입니다. 80% 이상이면 초록색으로 바뀝니다. 미션마다 따로 저장되므로 미션을 바꿔도 작성한 내용은 남습니다.</p>
  </aside>
  <main id="main" tabindex="-1">
    <article class="sheet" id="app"></article>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
